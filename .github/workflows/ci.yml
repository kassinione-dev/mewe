name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.11.19"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uvx ruff check src tests

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mewe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/mewe_test
      TEST_DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/mewe_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen

      - name: Single migration head
        run: test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Migrations upgrade, downgrade and upgrade again
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Models match migrations
        run: uv run alembic check

      - run: uv run pytest -v
