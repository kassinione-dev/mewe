name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    # Только после зелёного CI на пуше в main, не на pull request
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eo pipefail
            cd ./mewe
            git fetch origin main
            # Выкатываем коммит, прошедший CI, даже если в main уже успели запушить следующий
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            docker compose build

            mkdir -p ~/mewe-backups
            docker compose exec -T db sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction mewe_app' \
              | gzip > ~/mewe-backups/mewe_app-$(date +%Y%m%d-%H%M%S).sql.gz
            ls -1t ~/mewe-backups/*.sql.gz | tail -n +11 | xargs -r rm --

            docker compose run --rm web alembic upgrade head
            docker compose up -d
