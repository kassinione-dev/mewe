{% from "macros.html" import icon %}
{% set ep = request.endpoint or '' %}
<footer>
    <nav class="footer-nav" aria-label="Основная навигация">
        <ul class="nav-list">
            <li class="nav-item">
                <a class="nav-link search-btn{% if ep.startswith('index.') %} active{% endif %}"
                   href="{{ url_for('index.render_events_page') }}"
                   {% if ep.startswith('index.') %}aria-current="page"{% endif %}>
                    <span class="nav-icon-wrap">
                        {{ icon('search', 'nav-icon') }}
                    </span>
                    <span class="nav-label">Поиск</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link event-btn{% if ep.startswith('my_events.') %} active{% endif %}"
                   href="{{ url_for('my_events.render_my_event_page') }}"
                   {% if ep.startswith('my_events.') %}aria-current="page"{% endif %}>
                    <span class="nav-icon-wrap">
                        {{ icon('event', 'nav-icon') }}
                    </span>
                    <span class="nav-label">Мои события</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link profile-btn{% if ep.startswith('profile.') %} active{% endif %}"
                   href="{{ url_for('profile.render_profile_page') }}"
                   {% if ep.startswith('profile.') %}aria-current="page"{% endif %}>
                    <span class="nav-icon-wrap">
                        {{ icon('person', 'nav-icon') }}
                    </span>
                    <span class="nav-label">Профиль</span>
                </a>
            </li>
        </ul>
    </nav>
</footer>
