{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div id="events-page" data-create-url="{{ url_for('my_events.render_my_event_page') }}">
<div class="events-toolbar">
<div class="search-bar-container">
    <div class="search-icon-left"><i class="fas fa-magnifying-glass" aria-hidden="true"></i></div>
    <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию, месту, описанию" aria-label="Поиск мероприятий" enterkeyhint="search" autocomplete="off" />
    <button class="search-clear" id="searchClear" type="button" aria-label="Очистить поиск" hidden>
        <i class="fas fa-xmark" aria-hidden="true"></i>
    </button>
    <button class="categories-tab" id="categoriesTab" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Выбор категории">
        <i class="fas fa-table-cells-large categories-icon" aria-hidden="true"></i>
        <span>Категории</span>
        <span class="categories-count" id="categoriesCount" hidden></span>
    </button>
</div>
<div id="selectedCategoryFilter" class="selected-category-filter" hidden aria-label="Выбранные категории">
</div>
</div>
<div id="resultsBar" class="results-bar" hidden aria-live="polite">
    <span id="resultsCount"></span>
</div>
<div id="eventsContainer" class="events-container" aria-live="polite">
    <!-- Здесь будут динамически появляться карточки мероприятий -->
</div>
<div id="loadMoreWrap" class="load-more-wrap" hidden>
    <button class="btn load-more-btn" id="loadMoreBtn" type="button">Показать ещё</button>
</div>

<!-- -- -- Модальное окно категорий -->
<div class="modal categories-modal" id="categoriesModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-overlay" data-modal-close></div>
    <div class="modal-content">
        <button class="modal-close" type="button" aria-label="Закрыть" data-modal-close>
            <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
        <h2 id="modalTitle">Категории</h2>
        <div class="categories-grid">
            {% for category in categories %}
            <button class="category-option" type="button" aria-pressed="false"
                    data-category-id="{{ category.id }}" data-category-name="{{ category.name }}">
                <i class="fas {{ category.icon or 'fa-tag' }} category-option-icon" aria-hidden="true"></i>
                <span class="category-option-name">{{ category.name }}</span>
                <i class="fas fa-check category-option-check" aria-hidden="true"></i>
            </button>
            {% endfor %}
        </div>
        <div class="categories-footer">
            <button class="btn categories-reset" type="button" disabled data-categories-reset>Сбросить</button>
            <button class="btn categories-done" type="button" data-modal-close>Готово</button>
        </div>
    </div>
</div>

{% include "partials/event_detail_modal.html" %}
</div>
{% endblock %}

{% block styles %}
<link href="{{ url_for('static', filename='css/pages/events.css') }}" rel="stylesheet">
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/events.js') }}"></script>
{% endblock %}
