[project]
name = "mewe"
version = "0.1.0"
description = ""
authors = [
    {name = "kassinione",email = "feelinglev@gmail.com"}
]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "python-telegram-bot>=22.3,<23.0",
    "flask>=3.1.2,<4.0.0",
    "flask-sqlalchemy>=3.1.1,<4.0.0",
    "pymysql>=1.2.0,<2.0",
    "python-dotenv>=1.2.2,<2.0",
    "alembic>=1.19.1,<2.0",
    "gunicorn>=23.0.0,<24.0.0",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "bot.py"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
